# .readthedocs.yaml
# Read the Docs 配置文件

version: 2

# 设置 Python 版本
python:
  version: 3.11
  install:
    - requirements: docs/requirements.txt

# 构建文档
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# 构建格式
formats:
  - pdf
  - html
  - epub

# 如果需要 C++ 构建，可以启用
cmake:
  source: docs/source

# 搜索引擎优化
seo:
  canonical_url: true

# 社交媒体卡片
social:
  cards: true
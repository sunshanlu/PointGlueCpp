# .readthedocs.yaml
version: 2

build:
  os: ubuntu-22.04
  apt_packages:
    - doxygen
  tools:
    python: "3.10"
  jobs:
    post_create_environment:
      - cd docs
      - doxygen Doxyfile

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt

# 构建前准备

formats:
  - pdf
  - epub